name: Removal / scanning opt-out
description: Exclude your address space from LeakyCompute probing and remove existing records. Honored on receipt.
title: "[removal] Exclude address space"
labels:
  - removal-request
  - honor-immediately
body:
  - type: markdown
    attributes:
      value: |
        ## Opt out of LeakyCompute probing

        **This request is honored when we receive it, not when we finish reviewing it.**
        The listed space is excluded from any future probing and existing records
        are deleted. You do not need to explain why, and we will not ask you to
        justify it.

        Exclusions are permanent and do not expire. You can add to them later.

        **Prefer not to use GitHub?** A removal request carries exactly the same
        weight by email — see the contact on the maintainer's profile, or the
        `/scanning` page. A GitHub account is not required to be left alone.

        **Current status:** governed verification uses a daily lane-sharded
        schedule plus a pre-reset catch-up pass sized from remaining KV capacity.
        It is paused whenever the strong control plane, the reserved KV headroom,
        or another operational safety check is unavailable. Candidates must come from fresh
        approved public-index records, and an exclusion is checked authoritatively
        again immediately before a one-time permit can emit a request. Hosted checks
        are separate, user-initiated self-checks. All probes are read-only `GET`
        requests to reviewed version, health, or listing endpoints; we never send a
        payload, submit a job, or attempt to authenticate. See the live
        [scanning and opt-out status](https://leakycompute.mahdihedhli.com/scanning.html)
        and [SECURITY.md](https://github.com/MahdiHedhli/LeakyCompute/blob/main/docs/SECURITY.md).
  - type: textarea
    id: scope
    attributes:
      label: Address space to exclude
      description: |
        One entry per line. IPs, CIDR ranges, or AS numbers all work.
        Broad is fine — we would rather over-exclude than argue about boundaries.
      placeholder: |
        203.0.113.0/24
        198.51.100.17
        AS64496
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to this space
      description: For our records only. We do not require proof up front.
      options:
        - Network owner / operator
        - Hosting provider acting for a customer
        - Organization security team
        - CERT / CSIRT acting on behalf of a constituent
        - Other
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Only if you want confirmation once the exclusion is in place. Never published, never added to any list.
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: To the best of my knowledge I am authorized to request exclusion for this space.
          required: true
  - type: markdown
    attributes:
      value: |
        ---
        **Note on scope:** exclusion prevents any future probing and deletes *our* records.
        It cannot remove your hosts from Shodan, Censys, or any third-party index —
        those are separate services with their own removal processes. If a host is
        exposed, opting out of our measurement does not close it. The remediation
        guidance in [SECURITY.md](https://github.com/MahdiHedhli/LeakyCompute/blob/main/docs/SECURITY.md) and local checker
        applies regardless.
