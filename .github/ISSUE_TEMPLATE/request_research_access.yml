name: Request research lab access
description: Apply for GitHub-SSO access to the gated LeakyCompute researcher lab.
title: "[access] Research lab access for @"
labels:
  - access-request
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        ## LeakyCompute lab access

        Approvals grant **Cloudflare Access + allowlist** entry for **this GitHub account**.
        You will sign in with **GitHub SSO** (same user).

        Public self-check does **not** require access.

        **Access needs the primary email on your GitHub account**, not just your
        username — that is the identity Cloudflare Access asserts when you sign
        in. You can put it in the field below, or leave that blank and send it to
        **@MahdiHedhli** on GitHub after opening the issue. Nothing forces you to
        publish an address to get access, and we never republish it.
  - type: input
    id: github_login
    attributes:
      label: GitHub username to allowlist
      description: Must match the account you will use for Cloudflare GitHub SSO. Defaults to issue author if identical.
      placeholder: "octocat"
    validations:
      required: true
  - type: input
    id: access_email
    attributes:
      label: Primary email on your GitHub account (or leave blank and send it privately)
      description: >-
        Required to gain access, but not required *here*. Cloudflare Access signs
        you in through GitHub and asserts your account's primary email rather than
        your username, so the allowlist needs that address or your sign-in will
        succeed and every query will still be refused. Find it at
        github.com/settings/emails.
        If you would rather not post it in a public issue — a reasonable thing not
        to want — leave this blank, open the issue, and send the address to
        @MahdiHedhli on GitHub instead. Approval waits for it either way.
      placeholder: "you@example.com  ·  or leave blank and message @MahdiHedhli"
    validations:
      required: false
  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      description: Company, university, independent researcher, etc.
      placeholder: "Independent / Acme Research"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Research purpose
      description: What will you use the lab catalog/stats for? (No third-party weaponization.)
      placeholder: "Studying exposure trends for a defensive write-up…"
    validations:
      required: true
  - type: textarea
    id: repos
    attributes:
      label: Relevant public work
      description: Links to repos, papers, or prior research we can use while vetting.
    validations:
      required: true
  - type: checkboxes
    id: ethics
    attributes:
      label: Attestations
      options:
        - label: I will only probe systems I own or have explicit authorization to test.
          required: true
        - label: I will not use LeakyCompute to mass-scan the public internet or exploit third parties.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Optional context for the maintainer.
