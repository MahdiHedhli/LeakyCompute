name: Update LeakyCompute Stats

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}   # token with write access to the stats repo
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MahdiHedhli/leakycompute-stats
          path: stats_repo
      - name: Get aggregated stats from private Worker
        run: |
          curl -s https://<WORKER_SUBDOMAIN>.workers.dev/stats > stats.json
      - name: Convert to markdown
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('stats.json','utf8'));
          let md = `# LeakyCompute Exposure Stats\n\n`;
          md += `**Total hosts scanned:** ${data.total}\n`;
          md += `**Exposed hosts:** ${data.exposed}\n\n`;
          md += `**Top models:**\n`;
          Object.entries(data.models)
                .sort((a,b)=>b[1]-a[1])
                .slice(0,10)
                .forEach(([model,count])=> md += `- ${model}: ${count}\n`);
          fs.writeFileSync('STATS.md','# LeakyCompute Exposure Stats\n\n**Total hosts scanned:** '+data.total+'\n**Exposed hosts:** '+data.exposed+'\n\n**Top models:**\n'+md);
          NODE
      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stats – ${{ github.sha }}"
          file_pattern: STATS.md
          branch: main