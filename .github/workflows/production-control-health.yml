name: Production control-plane health

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify authoritative production state without target traffic
        env:
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_DISCOVERY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LEAKY_API_BASE:-}" ] || [ -z "${LEAKY_ADMIN_TOKEN:-}" ]; then
            echo "Required control-plane credentials are not configured."
            exit 1
          fi

          health_file="$(mktemp)"
          trap 'unlink "$health_file"' EXIT
          http_code="$(curl -sS -o "$health_file" -w '%{http_code}' \
            -H "X-Admin-Token: $LEAKY_ADMIN_TOKEN" \
            "${LEAKY_API_BASE%/}/v1/admin/control/health")"
          if [ "$http_code" != "200" ]; then
            echo "Strong control plane is unavailable (HTTP $http_code)."
            exit 1
          fi

          jq -e '
            .ok == true and
            .ready == true and
            (.schema >= 2) and
            .migration_complete == true and
            (.pending_purges == 0) and
            (.aggregate_generation | type == "string" and length > 0) and
            (.exclusions | type == "number" and . >= 0)
          ' "$health_file" >/dev/null

          jq '{
            ok,
            ready,
            schema,
            migration_complete,
            pending_purges,
            aggregate_generation_present: (.aggregate_generation | type == "string" and length > 0),
            authoritative_exclusions_readable: (.exclusions | type == "number" and . >= 0)
          }' "$health_file"
