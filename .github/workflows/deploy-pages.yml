name: Deploy public pulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  # Commits pushed with GITHUB_TOKEN intentionally do not emit another push
  # workflow. Deploy the card written by the isolated preview workflow when
  # that workflow completes successfully instead.
  workflow_run:
    workflows: ["Refresh social preview"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp asset URLs with a content hash
        run: |
          # A returning visitor keeps the stylesheet their browser cached, so a
          # shipped change reads as work that never landed. Stamping in CI means
          # it cannot be forgotten on a hurried commit.
          python3 scripts/stamp_assets.py
          if ! git diff --quiet -- public; then
            echo "::notice::Asset hashes were stale in the commit; stamped during build."
          fi

      - name: Upload public/ artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
