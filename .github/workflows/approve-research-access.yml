name: Approve research access

on:
  issues:
    types: [labeled]

jobs:
  approve:
    if: github.event.label.name == 'access-approved'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Resolve GitHub login
        id: user
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            // Prefer form field "GitHub username to allowlist"
            let login = null;
            const m = body.match(/### GitHub username to allowlist\s*\n\s*([@A-Za-z0-9-]+)/i);
            if (m) login = m[1].replace(/^@/, '');
            if (!login) login = issue.user.login;
            login = login.toLowerCase();
            if (!/^[a-z0-9](?:[a-z0-9]|-(?=[a-z0-9])){0,38}$/.test(login)) {
              core.setFailed(`Invalid GitHub login: ${login}`);
            }
            // Production Access identity is the exact signed email. A public
            // issue may omit it for privacy, but then this public-issue workflow
            // must stop and the maintainer must approve through a private path.
            const em = body.match(
              /###\s*Primary email on your GitHub account[^\n]*\n+\s*([^\n]+)/i
            );
            let accessEmail = em ? em[1].trim().toLowerCase() : '';
            if (/^_no response_$/i.test(accessEmail)) accessEmail = '';
            if (!accessEmail) {
              core.setFailed(
                'Access email is absent. Use the private manual approval path; ' +
                'a GitHub handle alone cannot match the signed Access identity.'
              );
            }
            if (accessEmail && !/^[^\s<>@]+@[^\s<>@]+\.[^\s<>@]+$/.test(accessEmail)) {
              core.setFailed('The Access email field is not a valid email address.');
            }
            core.setOutput('access_email', accessEmail);
            core.setOutput('login', login);
            core.setOutput('issue_number', String(issue.number));

      - name: Sync allowlist to Cloudflare Worker
        env:
          API_BASE: ${{ secrets.LEAKY_API_BASE }}
          ADMIN_TOKEN: ${{ secrets.LEAKY_ADMIN_SYNC_TOKEN }}
          LOGIN: ${{ steps.user.outputs.login }}
          ISSUE: ${{ steps.user.outputs.issue_number }}
          APPROVER: ${{ github.actor }}
          ACCESS_EMAIL: ${{ steps.user.outputs.access_email }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "Missing LEAKY_API_BASE or LEAKY_ADMIN_SYNC_TOKEN secrets."
            exit 1
          fi
          API_BASE="${API_BASE%/}"
          # Production Access presents the exact signed email. The GitHub handle
          # remains the administrative primary; its email alias is the only
          # production identity that may resolve to it.
          jq -nc \
            --arg login "$LOGIN" \
            --arg email "${ACCESS_EMAIL:-}" \
            --arg approved_by "$APPROVER" \
            --argjson issue "$ISSUE" \
            '{op:"approve", login:$login, issue_number:$issue,
              approved_by:$approved_by,
              aliases:(if $email == "" then [] else [$email] end)}' \
          | curl -fsS -X POST "$API_BASE/v1/admin/allowlist" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            --data-binary @-

      - name: Comment and relabel
        uses: actions/github-script@v7
        env:
          LOGIN: ${{ steps.user.outputs.login }}
          LAB_URL: ${{ secrets.LEAKY_LAB_URL }}
          HAS_EMAIL: ${{ steps.user.outputs.access_email != '' }}
        with:
          script: |
            const login = process.env.LOGIN;
            const hasEmail = process.env.HAS_EMAIL === 'true';
            const lab = process.env.LAB_URL || 'https://leakycompute-lab.pages.dev';
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (hasEmail ? [
                `### Access approved for \`@${login}\``,
                '',
                `Lab: ${lab}`,
                '',
                'Sign in with **GitHub** using **this same account** (Cloudflare Access).',
                'Both your username and the email you supplied are registered, so either',
                'identity resolves.',
                '',
                'If you see "not on the allowlist", wait ~1 minute and hard-refresh.',
                '',
                '_LeakyCompute · evidence first · panic never_',
              ] : [
                `### Approved for \`@${login}\` — one thing still needed`,
                '',
                'Your username is registered, but **access will not work yet.**',
                '',
                'Cloudflare Access signs you in through GitHub and asserts your account\'s',
                '**primary email address**, not your username. Until that address is on the',
                'allowlist, your sign-in will succeed and every query will still be refused.',
                '',
                `Send it to **@${context.repo.owner}** on GitHub — do not post it here unless`,
                'you are comfortable doing so. It is registered privately and never republished.',
                '',
                'Find it at <https://github.com/settings/emails>.',
                '',
                `Lab (once registered): ${lab}`,
                '',
                '_LeakyCompute · evidence first · panic never_',
              ]).join('\n'),
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: 'needs-review',
              });
            } catch (_) {}
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels: ['access-active'],
              });
            } catch (_) {}
