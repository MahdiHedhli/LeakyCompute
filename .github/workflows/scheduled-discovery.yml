name: Passive discovery dry run

# Active scheduling is suspended after the adversarial review found that an
# interrupted run can emit probes before their I-24 clock is persisted, and
# that the KV budget does not reserve capacity for opt-outs/revocations. This
# workflow is intentionally passive until the attempt ledger and write budget
# are strongly consistent. It sends no packets to candidate hosts and ingests
# nothing.

on:
  workflow_dispatch:
    inputs:
      max_total:
        description: "Candidate cap for the packet-free plan"
        default: "445"

concurrency:
  # Two runs must never overlap: they would each read the probe clock before the
  # other wrote to it, and both would consider the same hosts due.
  group: leaky-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Run discovery
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_ADMIN_SYNC_TOKEN }}
          MAX_TOTAL: ${{ github.event.inputs.max_total || '445' }}
        run: |
          set -euo pipefail
          if [ -z "${SHODAN_API_KEY:-}" ]; then
            echo "SHODAN_API_KEY secret is not set — add it before enabling this."
            exit 1
          fi
          python3 -u scripts/discovery/run_multilane.py \
            --dry-run --rate 0.2 --max-total "$MAX_TOTAL" \
            --output "discovery-run.json"

      - name: Summarise
        if: always()
        run: |
          # The gates' decisions are the interesting part of a run, not the
          # host count — surface them where a maintainer will actually see them.
          {
            echo "### Discovery run"
            echo '```'
            grep -E 'I-5:|provenance:|exclusions:|interval \(14d\)|Probing|exposed=|kv_puts|final verification' \
              discovery-run.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Do not upload discovery-run.json. It contains the private address-level
      # run record required for local diagnosis and ingest; an artifact on a
      # public repository is not a private store (I-14/I-27).
