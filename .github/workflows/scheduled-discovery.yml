name: Governed discovery

# Every target request is made by the API Worker's address-pinned runtime only
# after its Durable Object has committed a cooldown lease and one-time permit.
# This runner nominates fresh public-index candidates; it cannot open a target
# socket or fall back to the retired legacy probe path.

on:
  schedule:
    # Weekly, off the hour. The 14-day per-host cooldown remains authoritative,
    # so this can discover new candidates without accelerating old ones.
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      max_total:
        description: "Maximum governed candidates"
        default: "120"
      lanes:
        description: "Comma-separated lane IDs"
        default: "ollama,jupyter,ray,open_webui,litellm,vllm,comfyui"

concurrency:
  # Two runs must never overlap: they would each read the probe clock before the
  # other completed its plan. The Durable Object still prevents duplicate
  # leases, so this is resource hygiene rather than the primary safety control.
  group: leaky-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Run discovery
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_DISCOVERY_ADMIN_TOKEN }}
          MAX_TOTAL: ${{ github.event.inputs.max_total || '120' }}
          LANES: ${{ github.event.inputs.lanes || 'ollama,jupyter,ray,open_webui,litellm,vllm,comfyui' }}
        run: |
          set -euo pipefail
          if [ -z "${SHODAN_API_KEY:-}" ] || [ -z "${LEAKY_API_BASE:-}" ] || [ -z "${LEAKY_ADMIN_TOKEN:-}" ]; then
            echo "Required discovery credentials are not configured."
            exit 1
          fi
          case "$MAX_TOTAL" in (*[!0-9]*|'') echo "max_total must be an integer"; exit 1;; esac
          if [ "$MAX_TOTAL" -lt 1 ] || [ "$MAX_TOTAL" -gt 128 ]; then
            echo "max_total must be between 1 and 128"
            exit 1
          fi
          python3 -u scripts/discovery/run_multilane.py \
            --lanes "$LANES" --rate 0.2 --max-total "$MAX_TOTAL" \
            --ingest --output "discovery-run.json" 2>&1 | tee discovery-run.log

      - name: Summarise
        if: always()
        run: |
          # The gates' decisions are the interesting part of a run, not the
          # host count — surface them where a maintainer will actually see them.
          {
            echo "### Discovery run"
            echo '```'
            grep -E 'I-5:|provenance:|exclusions:|interval \(14d\)|Probing|exposed=|kv_puts|final verification' \
              discovery-run.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Never upload discovery-run.json. It contains the private address-level
      # run record required for local diagnosis and ingest; an artifact on a
      # public repository is not a private store (I-14/I-27).
