name: Governed discovery

# Every target request is made by the API Worker's address-pinned runtime only
# after its Durable Object has committed a cooldown lease and one-time permit.
# This runner nominates fresh public-index candidates; it cannot open a target
# socket or fall back to the retired legacy probe path.

on:
  schedule:
    # Four daily lane shards limit the capacity lost to any one failed run.
    # Successful lanes advance independent cursors; failed lanes do not.
    - cron: "43 5 * * *"
    - cron: "43 9 * * *"
    - cron: "43 13 * * *"
    - cron: "43 17 * * *"
    # Final all-lane catch-up pass has a wide buffer before the 00:00 UTC KV
    # reset because GitHub documents that scheduled events can be delayed. Its
    # packet-free preflight sizes it from remaining KV headroom.
    - cron: "13 18 * * *"
  workflow_dispatch:
    inputs:
      max_total:
        description: "Maximum governed candidates"
        default: "425"
      lanes:
        description: "Comma-separated lane IDs"
        default: "all"

concurrency:
  # Two runs must never overlap: they would each read the probe clock before the
  # other completed its plan. The Durable Object still prevents duplicate
  # leases, so this is resource hygiene rather than the primary safety control.
  group: leaky-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      max_total: ${{ steps.plan.outputs.max_total }}
      lanes: ${{ steps.plan.outputs.lanes }}
      should_run: ${{ steps.plan.outputs.should_run }}
    steps:
      - name: Verify strong control plane and size the run
        id: plan
        env:
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_DISCOVERY_ADMIN_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MAX: ${{ github.event.inputs.max_total || '425' }}
          INPUT_LANES: ${{ github.event.inputs.lanes || 'all' }}
        run: |
          set -euo pipefail
          if [ -z "${LEAKY_API_BASE:-}" ] || [ -z "${LEAKY_ADMIN_TOKEN:-}" ]; then
            echo "Required control-plane credentials are not configured."
            exit 1
          fi
          case "$EVENT_SCHEDULE" in
            "43 5 * * *")
              REQUESTED_MAX=128
              LANES="ollama,open_webui,litellm,triton"
              ;;
            "43 9 * * *")
              REQUESTED_MAX=128
              LANES="jupyter,ray,comfyui,tensorboard"
              ;;
            "43 13 * * *")
              REQUESTED_MAX=128
              LANES="localai,vllm,openai_compat_8000"
              ;;
            "43 17 * * *")
              REQUESTED_MAX=128
              LANES="openai_compat_8080,gradio,mlflow"
              ;;
            "13 18 * * *")
              REQUESTED_MAX=425
              LANES="all"
              ;;
            "")
              REQUESTED_MAX="$INPUT_MAX"
              LANES="$INPUT_LANES"
              ;;
            *)
              echo "Unknown schedule; refusing to infer a discovery plan."
              exit 1
              ;;
          esac
          case "$REQUESTED_MAX" in (*[!0-9]*|'') echo "max_total must be an integer"; exit 1;; esac
          if [ "$REQUESTED_MAX" -lt 1 ] || [ "$REQUESTED_MAX" -gt 425 ]; then
            echo "max_total must be between 1 and 425"
            exit 1
          fi
          if ! printf '%s' "$LANES" | grep -Eq '^(all|[a-z0-9_]+(,[a-z0-9_]+)*)$'; then
            echo "lanes must be 'all' or a comma-separated list of lane IDs"
            exit 1
          fi
          HEALTH_FILE="$(mktemp)"
          BUDGET_FILE="$(mktemp)"
          SOURCE_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE" "$BUDGET_FILE" "$SOURCE_FILE"' EXIT
          HTTP_CODE=$(curl -sS -o "$HEALTH_FILE" -w '%{http_code}' \
            -H "X-Admin-Token: $LEAKY_ADMIN_TOKEN" \
            "${LEAKY_API_BASE%/}/v1/admin/control/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Strong control plane is unavailable (HTTP $HTTP_CODE); no index query or target traffic was attempted."
            exit 1
          fi
          jq -e '.ok == true and .ready == true and (.schema >= 3) and (.pending_purges == 0)' \
            "$HEALTH_FILE" >/dev/null
          jq '{ok, ready, schema, pending_purges}' "$HEALTH_FILE"

          HTTP_CODE=$(curl -sS -o "$SOURCE_FILE" -w '%{http_code}' \
            -H "X-Admin-Token: $LEAKY_ADMIN_TOKEN" \
            "${LEAKY_API_BASE%/}/v1/admin/discovery/source-budget")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Strong Shodan source budget is unavailable (HTTP $HTTP_CODE); no index query or target traffic was attempted."
            exit 1
          fi
          jq -e '
            .ok == true and .provider == "shodan" and
            (.consumed | type == "number" and . >= 0) and
            (.monthly_limit | type == "number" and . > 0) and
            (.reserve | type == "number" and . >= 0) and
            (.paced_limit | type == "number" and . >= 0) and
            (.available_now | type == "number" and . >= 0) and
            (.remaining_month | type == "number" and . >= 0)
          ' "$SOURCE_FILE" >/dev/null
          jq '{provider, month, consumed, monthly_limit, reserve, paced_limit, available_now, remaining_month, reset_at}' "$SOURCE_FILE"
          SOURCE_AVAILABLE=$(jq -r '.available_now | floor' "$SOURCE_FILE")
          if [ "$SOURCE_AVAILABLE" -lt 1 ]; then
            echo "No paced Shodan source headroom remains; skipping before index access or target traffic."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "max_total=0" >> "$GITHUB_OUTPUT"
            echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o "$BUDGET_FILE" -w '%{http_code}' \
            -H "X-Admin-Token: $LEAKY_ADMIN_TOKEN" \
            "${LEAKY_API_BASE%/}/v1/admin/discovery/budget")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Authenticated KV budget view is unavailable (HTTP $HTTP_CODE); no index query or target traffic was attempted."
            exit 1
          fi
          jq -e '
            .ok == true and
            (.used | type == "number" and . >= 0) and
            (.budget | type == "number" and . > 0) and
            (.remaining | type == "number" and . >= 0) and
            (.reserve | type == "number" and . >= 0) and
            (.recommended_max_candidates | type == "number" and . >= 0 and . <= 425)
          ' "$BUDGET_FILE" >/dev/null
          SAFE_MAX=$(jq -r '.recommended_max_candidates | floor' "$BUDGET_FILE")
          if [ "$SAFE_MAX" -lt "$REQUESTED_MAX" ]; then MAX_TOTAL="$SAFE_MAX"; else MAX_TOTAL="$REQUESTED_MAX"; fi
          jq '{used, budget, remaining, reserve, recommended_max_candidates, reset_at}' "$BUDGET_FILE"
          if [ "$MAX_TOTAL" -lt 1 ]; then
            echo "No safe KV headroom remains; skipping before index access or target traffic."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "max_total=0" >> "$GITHUB_OUTPUT"
            echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Governed candidate envelope: $MAX_TOTAL across $LANES"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "max_total=$MAX_TOTAL" >> "$GITHUB_OUTPUT"
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"

  nominate:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Nominate fresh public-index records
        env:
          SHODAN_API_KEY_PRIMARY: ${{ secrets.SHODAN_API_KEY_PRIMARY || secrets.SHODAN_API_KEY }}
          SHODAN_API_KEY_SECONDARY: ${{ secrets.SHODAN_API_KEY_SECONDARY }}
          SHODAN_SECONDARY_FAILOVER_ENABLED: ${{ vars.SHODAN_SECONDARY_FAILOVER_ENABLED || 'false' }}
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_NOMINATOR_TOKEN: ${{ secrets.LEAKY_DISCOVERY_NOMINATOR_TOKEN }}
          MAX_TOTAL: ${{ needs.preflight.outputs.max_total }}
          LANES: ${{ needs.preflight.outputs.lanes }}
        run: |
          set -euo pipefail
          if [ -z "${SHODAN_API_KEY_PRIMARY:-}" ] || [ -z "${LEAKY_API_BASE:-}" ] || [ -z "${LEAKY_NOMINATOR_TOKEN:-}" ]; then
            echo "Required nomination credentials are not configured."
            exit 1
          fi
          case "$MAX_TOTAL" in (*[!0-9]*|'') echo "max_total must be an integer"; exit 1;; esac
          if [ "$MAX_TOTAL" -lt 1 ] || [ "$MAX_TOTAL" -gt 425 ]; then
            echo "max_total must be between 1 and 425"
            exit 1
          fi
          python3 -u scripts/discovery/nominate_public_index.py \
            --lanes "$LANES" --max-total "$MAX_TOTAL" --pages-per-lane 1 \
            --output "nomination-manifest.json" 2>&1 | tee nomination.log
          jq -e '
            (keys | sort) == ["meta", "nomination_ids"] and
            (.nomination_ids | type == "array") and
            (.meta | type == "object") and
            ([.nomination_ids[] | type == "string"] | all)
          ' nomination-manifest.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opaque-discovery-nominations
          path: nomination-manifest.json
          retention-days: 1
          if-no-files-found: error

  probe:
    needs: nominate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: opaque-discovery-nominations

      - name: Lease and probe immutable nominations
        env:
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_DISCOVERY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LEAKY_API_BASE:-}" ] || [ -z "${LEAKY_ADMIN_TOKEN:-}" ]; then
            echo "Required probe credentials are not configured."
            exit 1
          fi
          python3 -u scripts/discovery/probe_nominations.py \
            --manifest nomination-manifest.json --rate 0.2 --ingest \
            --output discovery-run.json 2>&1 | tee discovery-run.log

      # The public counter reads only a completed authoritative generation.
      # Publish that generation before this workflow succeeds so workflow_run
      # consumers (notably the OG renderer) cannot race the nightly rebuild.
      - name: Publish current aggregate generation
        env:
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_DISCOVERY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          for attempt in $(seq 1 20); do
            HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
              -X POST "${LEAKY_API_BASE%/}/v1/admin/control/reconcile" \
              -H "Content-Type: application/json" \
              -H "X-Admin-Token: $LEAKY_ADMIN_TOKEN" \
              -d '{"limit":500}')
            if [ "$HTTP_CODE" != "200" ] || ! jq -e '.ok == true' "$RESPONSE_FILE" >/dev/null; then
              echo "Authoritative aggregate publication failed; social preview will preserve its last good card."
              exit 1
            fi
            if jq -e '.complete == true' "$RESPONSE_FILE" >/dev/null; then
              echo "Authoritative aggregate generation published."
              exit 0
            fi
          done
          echo "Authoritative aggregate publication did not complete within the bounded pass limit."
          exit 1

      - name: Summarise
        if: always()
        run: |
          # The gates' decisions are the interesting part of a run, not the
          # host count — surface them where a maintainer will actually see them.
          {
            echo "### Discovery run"
            echo '```'
            grep -E 'Probing up to|SKIP:|governed results:|ingest batch ok' \
              discovery-run.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Never upload discovery-run.json. It contains the private address-level
      # run record required for local diagnosis and ingest; an artifact on a
      # public repository is not a private store (I-14/I-27).
