name: Scheduled discovery

# TWO RUNS A DAY, sized to the free-tier KV ceiling.
#
# Enabled 2026-08-19 under amended I-23: attribution is the User-Agent plus the
# /scanning page, with PTR required only where we control the source address.
# A GitHub-hosted runner has neither a stable address nor a PTR we own, and
# /scanning now says so rather than implying a lookup that would not resolve
# to us.
#
# Budget arithmetic, because it is tight: ~1.09 KV puts per probed host, so
# 2 x 445 is ~984 puts against a free-tier hard limit of 1,000. Crossing that
# blocks writes account-wide until 00:00 UTC, which would take the public
# checker down with it — so the ceiling is not something to run at.
#
# KV_DAILY_PUT_BUDGET stays at 950, below the worst case on purpose. On a day
# where both runs fill their cap the second is refused before it writes
# anything: that costs a run, where crossing 1,000 would cost the account. In
# practice the I-24 interval gate keeps actual probes well under the cap — run 3
# put up 380 candidates and probed 204 — so a maximal day is the exception.

on:
  workflow_dispatch:
    inputs:
      max_total:
        description: "Host cap for this run (KV-safe default)"
        default: "445"
      dry_run:
        description: "Dry run — pull and gate, send no packets"
        type: boolean
        default: false
  schedule:
    # 02:10 and 14:10 UTC. Offset from the 04:17 retention sweep so the two
    # never contend for the same KV budget window.
    - cron: "10 2 * * *"
    - cron: "10 14 * * *"

concurrency:
  # Two runs must never overlap: they would each read the probe clock before the
  # other wrote to it, and both would consider the same hosts due.
  group: leaky-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          LEAKY_API_BASE: ${{ secrets.LEAKY_API_BASE }}
          LEAKY_ADMIN_TOKEN: ${{ secrets.LEAKY_ADMIN_SYNC_TOKEN }}
          MAX_TOTAL: ${{ github.event.inputs.max_total || '445' }}
        run: |
          set -euo pipefail
          if [ -z "${SHODAN_API_KEY:-}" ]; then
            echo "SHODAN_API_KEY secret is not set — add it before enabling this."
            exit 1
          fi
          MODE="--ingest"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then MODE="--dry-run"; fi
          python3 -u scripts/discovery/run_multilane.py \
            $MODE --rate 0.2 --max-total "$MAX_TOTAL" \
            --output "discovery-run.json"

      - name: Summarise
        if: always()
        run: |
          # The gates' decisions are the interesting part of a run, not the
          # host count — surface them where a maintainer will actually see them.
          {
            echo "### Discovery run"
            echo '```'
            grep -E 'I-5:|provenance:|exclusions:|interval \(14d\)|Probing|exposed=|kv_puts|final verification' \
              discovery-run.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-run
          path: discovery-run.json
          retention-days: 14
