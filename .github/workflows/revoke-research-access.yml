name: Revoke research access

on:
  issues:
    types: [labeled]

jobs:
  revoke:
    if: github.event.label.name == 'access-revoked'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Resolve GitHub login
        id: user
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            let login = null;
            const m = body.match(/### GitHub username to allowlist\s*\n\s*([@A-Za-z0-9-]+)/i);
            if (m) login = m[1].replace(/^@/, '');
            if (!login) login = issue.user.login;
            login = login.toLowerCase();
            if (!/^[a-z0-9](?:[a-z0-9]|-(?=[a-z0-9])){0,38}$/.test(login)) {
              core.setFailed(`Invalid GitHub login: ${login}`);
            }
            core.setOutput('login', login);

      - name: Revoke on Worker
        env:
          API_BASE: ${{ secrets.LEAKY_API_BASE }}
          ADMIN_TOKEN: ${{ secrets.LEAKY_ADMIN_SYNC_TOKEN }}
          LOGIN: ${{ steps.user.outputs.login }}
        run: |
          set -euo pipefail
          API_BASE="${API_BASE%/}"
          jq -nc --arg login "$LOGIN" '{op:"revoke", login:$login}' \
          | curl -fsS -X POST "$API_BASE/v1/admin/allowlist" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            --data-binary @-

      - name: Comment
        uses: actions/github-script@v7
        env:
          LOGIN: ${{ steps.user.outputs.login }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Access revoked for \`@${process.env.LOGIN}\`.`,
            });
