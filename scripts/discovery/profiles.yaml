# LeakyCompute discovery query profiles
# Passive Shodan first; active probes only with slow caps (see discover.py).
#
# Severity context (for the post — cite primary sources, not this file):
# - NadMesh (mid-2026): bot harvests Shodan for ComfyUI/Ollama/n8n/Open WebUI/Langflow/Gradio → exploit queue
# - ShadowRay / ShadowRay 2.0 (Oligo): self-propagating abuse of open Ray dashboards
# - GreyNoise LLM endpoint campaigns (late 2025–early 2026)
# - SentinelOne/Censys Ollama exposure study (~175k class figures)
#
# Line vs NadMesh: we stop at discovery + safe read-only probes on capped sets.
# We do not exploit, harvest cloud creds, or feed RCE queues.

version: 1

# ---------------------------------------------------------------------------
# SOURCE REGISTRY
# ---------------------------------------------------------------------------
# Adding sources to the passive census is free; adding them to the active lane
# is not. Keep the two separate:
#
#   census  = counts / facets / candidate lists. No probe cost. More is better.
#   active  = slow safe GETs. Capped (see docs/DISCOVERY.md). Sample the census.
#
# Until spec 001 §3 these were tied together — `search_limit` was set equal to
# `max_hosts` in every lane, so the census was throttled to the probe budget and
# the published count measured our restraint rather than the internet. They are
# now independent in run_multilane.LANES: census bounded by source ToS and API
# quota (I-21), probes bounded by I-24. Do not re-couple them.
#
# `auth` tells you what has to exist before a lane can run, so signup work can
# be queued ahead of implementation work. Quotas move — verify at signup.
sources:
  shodan:
    status: live
    auth: {account: true, key: SHODAN_API_KEY, friction: none}
    note: Already wired. Membership tier. Facets + host search.

  crt_sh:
    status: planned
    auth: {account: false, key: null, friction: none}
    note: >
      Certificate Transparency search over a public HTTP/JSON endpoint.
      NO SIGNUP. Start here — it needs nothing but politeness on request rate.
      Finds the reverse-proxied-on-443 population that port queries cannot see.

  certstream:
    status: planned
    auth: {account: false, key: null, friction: none}
    note: Real-time CT websocket feed. No signup. Complements crt.sh backfill.

  common_crawl:
    status: planned
    auth: {account: false, key: null, friction: none}
    note: Free index API. Body-level fingerprints (Gradio pages, /v1/models).

  censys:
    status: planned
    auth: {account: true, key: "CENSYS_* (id+secret or platform token)", friction: low}
    note: >
      Second independent census. Cert-centric, different scan cadence than
      Shodan. Free tier has been repeatedly reworked — CONFIRM CURRENT QUOTA
      AT SIGNUP before designing a lane around it.

  netlas:
    status: planned
    auth: {account: true, key: NETLAS_API_KEY, friction: low}
    note: Full response-body search. Good for banner strings on odd ports.

  fofa:
    status: planned
    auth: {account: true, key: "FOFA_EMAIL + FOFA_KEY", friction: medium}
    note: >
      Materially better APAC/CN coverage. Our by-country chart is currently
      Shodan-shaped; this is the fix. Some operators require paid tiers for
      bulk export — free tier may be count-only.

  zoomeye:
    status: planned
    auth: {account: true, key: ZOOMEYE_API_KEY, friction: medium}
    note: APAC coverage. Monthly free quota.

  quake:
    status: deferred
    auth: {account: true, key: QUAKE_API_KEY, friction: high}
    note: >
      BLOCKER: signup has historically required a mainland-China mobile number.
      Do not put this on the critical path; treat as opportunistic.

  shadowserver:
    status: deferred
    auth: {account: true, key: null, friction: high}
    note: >
      Free daily reports, but ONLY for netblocks you can prove you own.
      Not a discovery source for third parties — relevant only if we report
      on our own infrastructure. Verification is a manual, multi-day process.

  greynoise:
    status: planned
    auth: {account: true, key: GREYNOISE_API_KEY, friction: low}
    note: >
      Enrichment, not discovery: tells us who is ALREADY scanning these ports.
      Strengthens the "attackers run these queries" claim with evidence.

# Every query that feeds an ACTIVE lane must pin an explicit `port:` filter.
# The runner takes the probe port from the index record, not from default_port,
# so an unpinned query is how a host indexed on some arbitrary port becomes a
# probe target. Pinning is what carries I-5's per-service allowlist off-Worker,
# where resolvePort() is not in the path. Census-only queries may be unpinned.
#
# `safe_probe.path` is metadata / health / version / listing, and nothing else
# (I-2). When a service offers both a cheap metadata path and a real one behind
# its auth gate, prefer the one a real caller hits: we publish that an endpoint
# answered an unauthenticated read (I-3), and a path the vendor exempts from
# auth cannot support that claim. See vllm below for the worked example.
#
# Technique: negative-banner filters convert "open port" → "likely unauth"
# Example: Jupyter with title minus token HTML is the clincher.
#
# Second technique: favicon hashes ignore port, title and page language, so
# they catch reverse-proxied and non-standard-port instances that every
# port-anchored query above structurally misses.
# Generate with: python3 scripts/discovery/favicon_hash.py --yaml <label>=<url>
# NEVER copy hashes from blog posts — a stale hash returns zero results, which
# reads like "no exposure" instead of "wrong query".

profiles:

  # --- Flagship three ---
  ollama:
    name: Ollama
    priority: 1
    shodan:
      - product:Ollama port:11434
      - 'port:11434 "Ollama"'
      - 'port:11434 "Ollama is running"'
    default_port: 11434
    favicon:
      shodan_mmh3: null   # CONFIRMED against ollama 0.32.6: no favicon (404).
      md5: null           # Favicon pivots do not work for Ollama — use
      generated_from: null #  product:Ollama + "Ollama is running" instead.
    ct_patterns:          # hostname regexes for CT / passive DNS lanes
      - '^ollama\.'
      - '(^|[.-])ollama[.-]'
      - '^llm\.'
    safe_probe:
      method: GET
      path: /api/ps
      # alternate: /api/tags
    notes: >
      Exposure is the vulnerability for unauth list/pull/generate.
      Prefer product:Ollama for signal; banner string alone under-indexes on some plans.

  ray:
    name: Ray Dashboard
    priority: 1
    shodan:
      - port:8265
      - 'http.title:"Ray" port:8265'
    default_port: 8265
    favicon:
      shodan_mmh3: 463802404
      md5: b01715fdffe506f5a4dc79170429446c
      generated_from: "local-lab /favicon.ico"
      generated_version: "ray 2.56.1"   # hashes drift across releases — regenerate on bump
    ct_patterns:
      - '^ray\.'
      - '(^|[.-])ray-?dash'
    safe_probe:
      method: GET
      path: /api/version
    notes: >
      Jobs API often lacks auth if dashboard is reachable.
      "Shadow" exposure class (open-ports-checker pattern) — scanners that only
      check CVEs miss "dashboard reachable => job submission".

  jupyter:
    name: Jupyter (likely unauthenticated)
    priority: 1
    shodan:
      - 'http.title:"Jupyter" port:8888 -http.html:"token"'
      - 'http.title:"Jupyter" port:8888 -http.html:"login"'
    contrast_query: 'http.title:"Jupyter" port:8888'  # includes auth walls
    favicon:
      shodan_mmh3: -895963602
      md5: 97c6417ed01bdc0ae3ef32ae4894fd03
      generated_from: "local-lab /favicon.ico"
      generated_version: "quay.io/jupyter/base-notebook 2026-08"   # hashes drift across releases — regenerate on bump
    ct_patterns:
      - '^jupyter\.'
      - '^(nb|notebook|lab)\.'
      - '(^|[.-])jupyterhub[.-]?'
    default_port: 8888
    safe_probe:
      method: GET
      path: /
    notes: >
      Stack id is "jupyter" (matches worker services.js / tier-1 checker).
      Negative filter: raw port:8888 is noise; title minus token HTML ≈ wide open.

  # --- Broader AI / automation stack ---
  open_webui:
    name: Open WebUI
    priority: 2
    shodan:
      - 'http.title:"Open WebUI" port:8080'
      - 'http.html:"Open WebUI" port:8080'
    default_port: 8080
    known_other_ports: [3000]   # census only — not in the active lane (I-5)
    favicon:
      shodan_mmh3: -2059688262
      md5: d3d2358dc9adb5a786edd0d3747b690a
      generated_from: "local-lab /favicon.ico"
      generated_version: "open-webui 0.11.0"
    safe_probe:
      method: GET
      path: /api/config
    notes: >
      Often front door to Ollama / OpenAI-compatible backends.
      /api/config is the public config document. Preferred over "/" because the
      SPA shell renders for a fully locked-down instance too, so a 200 on "/"
      does not support the unauthenticated-read claim.

  comfyui:
    name: ComfyUI
    priority: 2
    shodan:
      - 'port:8188 http.title:"ComfyUI"'
    default_port: 8188
    safe_probe:
      method: GET
      path: /system_stats
    notes: GPU compute exposure; NadMesh harvests this class.

  gradio:
    name: Gradio
    priority: 2
    shodan:
      - 'http.title:"Gradio" port:7860'
      - port:7860
    default_port: 7860
    safe_probe:
      method: GET
      path: /config
    notes: >
      Demo UIs. /config returns the interface schema — it describes the
      endpoints; /run/*, /call/* and /queue/join would invoke them. That line is
      the whole distinction (I-2, I-3), so it is stated here rather than left to
      "avoid invoking predict endpoints".

  localai:
    name: LocalAI
    priority: 2
    shodan:
      - 'http.html:"LocalAI" port:8080'
      - 'http.title:"LocalAI" port:8080'
    default_port: 8080
    safe_probe:
      method: GET
      path: /v1/models

  litellm:
    name: LiteLLM
    priority: 2
    shodan:
      - 'http.html:"LiteLLM" port:4000'
    default_port: 4000
    safe_probe:
      method: GET
      path: /health

  vllm:
    name: vLLM
    priority: 2
    shodan:
      - 'http.html:"vLLM" port:8000'
      - 'port:8000 http.html:"/v1/models"'
    default_port: 8000
    safe_probe:
      method: GET
      path: /v1/models
    notes: >
      Both /version and /v1/models are read-only, and we use /v1/models.
      vLLM's API-key middleware guards /v1/* only, so /version answers on a
      key-protected server as well: a 200 there evidences reachability, not an
      unauthenticated read, and I-3 is a claim about the latter. /v1/models sits
      behind the same gate a real caller meets, and is a listing endpoint (I-2).
      Never bare port:8000 — that is a port prober's query, not a lane.

  triton:
    name: NVIDIA Triton Inference Server
    priority: 2
    shodan:
      - 'port:8000 "Triton Inference Server"'
    default_port: 8000          # KServe v2 HTTP
    known_other_ports: [8001, 8002]   # gRPC, Prometheus metrics — see notes
    safe_probe:
      method: GET
      path: /v2                 # server metadata: name, version, extensions
    notes: >
      Model inventory is NOT probed. Under the v2 protocol it is
      POST /v2/repository/index, and no finding justifies a non-GET (I-1).
      GET /v2/models is not a listing endpoint — v2 only exposes
      /v2/models/{name}, so there is nothing to enumerate without a name.
      Metrics on 8002 are a legitimate read but the exposition is unbounded and
      the runner has no equivalent of the Worker's 32 KB body cap (I-7), so 8002
      stays out of the active lane. Low-yield fingerprint: Triton answers "/"
      with a 400, so banner-anchored matching is weak. Verify a non-zero result
      before reading a zero as "no exposure".

  openai_compat:
    name: OpenAI-compatible generic
    priority: 3
    shodan:
      - 'http.html:"/v1/models"'
      - 'http.html:"/v1/chat/completions"'
      - 'port:8080 http.html:"/v1/models"'
      - 'port:8000 http.html:"/v1/models"'
    default_port: 8000
    safe_probe:
      method: GET
      path: /v1/models

  mlflow:
    name: MLflow
    priority: 3
    shodan:
      - 'http.title:"MLflow" port:5000'
    favicon:
      shodan_mmh3: -1507094812
      md5: c155726e1593418a937de00e65990e40
      generated_from: "local-lab /static-files/favicon.ico"  # NOT /favicon.ico
      generated_version: "mlflow 3.15.1"
    default_port: 5000
    safe_probe:
      method: GET
      path: /health
    notes: >
      /health, not the tracking API. Experiment and run listings are content we
      would have to refuse to retain under I-26, so we do not fetch them; the
      finding is "answers an unauthenticated read", which /health carries.

  tensorboard:
    name: TensorBoard
    priority: 3
    shodan:
      - 'http.title:"TensorBoard" port:6006'
    favicon:
      shodan_mmh3: null   # CONFIRMED against tensorboard 2.21.0: the icon is
      md5: null           # inlined as a data: URI, so there is no HTTP resource
      generated_from: null #  for an engine to hash. Favicon pivots don't apply.
    default_port: 6006
    safe_probe:
      method: GET
      path: /data/plugins_listing
    notes: >
      Enabled-plugin listing — read-only, and the call TensorBoard's own
      frontend makes on load. Chosen over /data/logdir, which returns a host
      filesystem path: more than the finding needs and retained nowhere (I-26).
      If a release moves this path we under-count, which is the safe direction
      to be wrong in (I-8) — it never sends more.

  # --- Do not use as primary seeds (noise) ---
noise_ports:
  - port:8000 http
  - port:8080 http
  - port:5000 http
  - port:8888
  - port:1234

# Suggested first active calibration set (slow)
calibration_lanes:
  - ollama
  - jupyter
  - ray
  - open_webui

# Tier-2 lanes added under spec 001 step 4. Listed separately because they are
# unproven: no yield baseline yet, so a zero from one of these is "query not
# calibrated" until a run says otherwise. Do not publish a count from a lane
# that has never returned a non-zero.
tier2_lanes:
  - vllm
  - triton
  - gradio
  - open_webui
  - mlflow
  - tensorboard
