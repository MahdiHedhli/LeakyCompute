# LeakyCompute API Worker — free-tier friendly
# Replace KV ids after: wrangler kv namespace create LEAKY_KV
#                      wrangler kv namespace create LEAKY_KV --preview
name = "leakycompute-api"
main = "worker/src/index.js"
compatibility_date = "2025-11-01"
workers_dev = true

# Public site CORS + domain-ready: set CUSTOM_ORIGINS later to include your domain
[vars]
ENVIRONMENT = "production"
# Comma-separated allowed browser origins (GitHub Pages + Pages lab + localhost)
ALLOWED_ORIGINS = "http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500,https://mahdihedhli.github.io,https://leakycompute-lab.pages.dev"
# Research snapshot (archive seed) — dual counter "C"
SNAPSHOT_MODELS = "1864"
SNAPSHOT_HOSTS = "19348"
# Rate limits (public self-check)
RL_OWN_WINDOW_SEC = "900"
RL_OWN_MAX = "3"
RL_OWN_DAY_MAX = "12"
RL_OVERRIDE_WINDOW_SEC = "900"
RL_OVERRIDE_MAX = "1"
RL_OVERRIDE_DAY_MAX = "3"
RL_GLOBAL_DAY_MAX = "800"
# Per-probe timeout. Tier-1 services are probed in parallel, so worst-case
# wall clock is roughly 2x this (confirm + exposure), not 3x this.
CHECK_TIMEOUT_MS = "2500"
# Tier-1 services and their permitted ports are defined in
# worker/src/lib/services.js. Ports are validated against that per-service
# list, so /v1/check cannot be used as a general-purpose port prober.
# Cloudflare Access (lab JWT validation)
ACCESS_TEAM_DOMAIN = "odd-night-42c2.cloudflareaccess.com"
ACCESS_AUD = "" # removed from public history

# --- Researcher lab (/v1/research/lab/*) -----------------------------------
# Every lab route is behind Cloudflare Access + the researcher allowlist and
# returns raw addresses, so these limits protect the corpus and the KV budget,
# not the public API. Counted per allowlisted login, not per IP: a shared exit
# node must not let one researcher exhaust another's quota.
RL_LAB_MAX = "120"
RL_LAB_WINDOW_SEC = "300"
# Seconds a Worker isolate may reuse a corpus read. Exclusions are re-applied on
# every request regardless (I-25), so this never delays an opt-out taking effect.
LAB_CACHE_TTL_SEC = "60"

# --- Re-verification + retention governance --------------------------------
# I-24: at most one probe cycle per host per this many days. The runner holds
# the enforcing copy; the lab reads this to report when a host next becomes
# eligible. Lowering it here does NOT let the runner probe faster — the floor
# lives in scripts/discovery/run_multilane.py.
REPROBE_INTERVAL_DAYS = "14"
# I-26: delete a record this many days after its last *successful* probe. 180 is
# the invariant's ceiling; this var can only tighten it (see retentionWindow()
# in worker/src/index.js), because widening retention would amend I-26.
CORPUS_EXPIRY_DAYS = "180"
# Workers KV free tier is 1,000 put operations a day, and crossing it blocks
# writes account-wide until 00:00 UTC. Ingest refuses before its first write
# rather than failing partway and leaving records without the aggregates that
# describe them. Raise this on a paid plan.
KV_DAILY_PUT_BUDGET = "900"
# I-27: days between the first notification attempt and publication of any
# host-identifying detail. Aggregates are not gated by this window.
DISCLOSURE_WINDOW_DAYS = "90"

# I-26 expiry on silence. Retention is only real if something runs unattended;
# the admin route POST /v1/admin/discovery/sweep is the manual equivalent.
# Daily, off the hour, because nothing here is time-critical.
[triggers]
crons = ["17 4 * * *"]

[[kv_namespaces]]
binding = "KV"
id = "432febf1abd64e9995e33d6081dfd3c7"
preview_id = "32c933f498d646afae8eb1e617063f8b"

# Secrets (set via wrangler secret put — never commit):
#   TURNSTILE_SECRET_KEY   optional; if unset, Turnstile check is skipped (dev only)
#   ABUSE_LOG_SALT         salt for hashing client IPs in private abuse logs
#   ADMIN_SYNC_TOKEN       GitHub Action uses this to write allowlist entries
